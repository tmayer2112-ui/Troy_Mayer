name: firmware

on:
  push:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  # The control core against the motor + limb model, and the sketch against stub headers.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -S firmware -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4
      - name: Unit and closed-loop tests
        run: ctest --test-dir build --output-on-failure
      - name: Sketch compiles as C++ and setup() runs
        run: ./build/sketch_syntax_check > /dev/null

  # The real thing: Arduino-ESP32 3.x toolchain, ESP32-S3, USB CDC on boot.
  esp32s3-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          sketch-paths: |
            - firmware/emg_orthosis
          cli-compile-flags: |
            - --warnings
            - all
          enable-warnings-report: true
